# Nom de notre pipeline d'intégration continue
name: ClickFast CI

# Déclenchement automatique du pipeline
on:
  # Lorsqu'on envoie du code sur GitHub
  push:

  # Lorsqu'on propose une modification du projet
  pull_request:

# Autorisation minimale pour lire le dépôt
permissions:
  contents: read

# Les différentes tâches du pipeline
jobs:

  # ==================================================
  # TÂCHE 1 : TESTER LE PROJET
  # ==================================================
  test:

    # GitHub fournit une machine virtuelle Ubuntu
    runs-on: ubuntu-latest

    steps:

      # Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Installer Node.js 22
      - name: Configurer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Installer les dépendances du jeu
      - name: Installer les dépendances du jeu
        run: npm ci

      # Exécuter les tests Jest du jeu
      - name: Tester le compteur et le chrono
        run: npm test

      # Installer les dépendances de l'API Express
      - name: Installer les dépendances de l'API
        run: npm ci
        working-directory: api

      # Exécuter les tests Jest de l'API
      - name: Tester les routes de l'API
        run: npm test
        working-directory: api

  # ==================================================
  # TÂCHE 2 : CONSTRUIRE LES IMAGES DOCKER
  # ==================================================
  build:

    # Ne démarre que si tous les tests réussissent
    needs: test

    runs-on: ubuntu-latest

    steps:

      # Récupérer le code du projet
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Construire les trois images Docker
      # À ce stade, rien n'est encore publié
      - name: Construire les trois images
        run: |
          docker build -t clickfast-web:test .
          docker build -t clickfast-api:test ./api
          docker build -t clickfast-stats:test ./stats-api

      # Connexion sécurisée à Docker Hub
      # Cette étape s'exécute uniquement après un push sur main
      # Les pull requests ne peuvent pas publier d'image
      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Donner à l'image API un nom et une version précise
      # github.sha correspond au numéro unique du commit Git
      #
      # Exemple :
      # gomaso/clickfast-api:7d300c6...
      - name: Identifier la version de l'API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag clickfast-api:test gomaso/clickfast-api:${{ github.sha }}

      # Publier l'image versionnée sur Docker Hub
      # Si les tests ou la construction échouent,
      # cette étape ne sera jamais exécutée
      - name: Publier l'API sur Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push gomaso/clickfast-api:${{ github.sha }}