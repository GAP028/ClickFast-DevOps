# Exécute des images publiées : aucun code source nécessaire pour les services applicatifs.
services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 12
  api:
    image: ${DOCKERHUB_USER:?required}/clickfast-api:${IMAGE_TAG:?required}
    environment: &db-env
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  web:
    image: ${DOCKERHUB_USER:?required}/clickfast-web:${IMAGE_TAG:?required}
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]
    networks: [private]
  stats-api:
    image: ${DOCKERHUB_USER:?required}/clickfast-stats:${IMAGE_TAG:?required}
    environment: *db-env
    ports: ["127.0.0.1:${STATS_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  adminer:
    image: adminer:4.8.1
    ports: ["127.0.0.1:${ADMINER_PORT:-8081}:8080"]
    depends_on: [db]
    networks: [private]
volumes:
  pgdata:
networks:
  private:
    driver: bridge
