<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css" />
    <title>ClickFast</title>
  </head>
  <body>
    <main id="container" class="flex-center">
      <h1>ClickFast ⚡</h1>
      <p class="catchphrase">Clique le plus de fois possible en 5 secondes !</p>
      <p>Temps restant : <strong id="timer">5.0</strong> s</p>
      <p>Score : <strong id="score">0</strong></p>
      <button id="button-clicker" type="button">Commencer / Cliquer !</button>
      <button id="button-reset" type="button">Rejouer</button>
      <p id="message" role="status">Prêt pour le défi ?</p>
      <form id="score-form" hidden>
        <label for="username">Pseudo</label>
        <input id="username" maxlength="30" required placeholder="Ton pseudo" />
        <button type="submit">Enregistrer mon score</button>
      </form>
      <section aria-label="Classement">
        <h2>Classement</h2>
        <ol id="leaderboard"></ol>
        <p id="api-status" role="status"></p>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
