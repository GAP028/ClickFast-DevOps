server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    # Le navigateur appelle /api sur le même domaine, évitant CORS.
    resolver 127.0.0.11 valid=10s;
    set $backend api;
    location /api/ { proxy_pass http://$backend:3000; }
}
